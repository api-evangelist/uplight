source: https://uplight.com/blog/stepping-up-to-support-open-standards-for-scaling-vpps/
summary: >-
  Uplight names a set of DER control / demand response standards it says its platform
  supports. Every one of these is a vendor marketing claim in a blog post — no
  conformance certificate, certified-product register entry, test report, or public
  endpoint was found for any of them. They are recorded here as claimed, not verified.
  On the web-API side nothing can be asserted: no OpenAPI, no OAuth/OIDC discovery, and
  no publicly readable reference exist, so the cross-cutting HTTP standards are recorded
  as unknown rather than false where the gated surface could plausibly implement them.
standards:
