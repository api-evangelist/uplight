  name: OpenADR
  conforms: claimed
  verified: false
  evidence: >-
    "supporting standards such as OpenADR" — uplight.com blog, "Stepping Up to Support
    Open Standards for Scaling VPPs" (posted 2023-04-20, updated 2024-10-23). No version
    (2.0a/2.0b/3.0) named, no OpenADR Alliance certification record found.
