artifacts:
  openapiHarvested: false
  specsCount: 0
  reason: |
    Nothing real was found to save. The only spec-shaped URLs that returned 200
    (docs.uplight.com/openapi.json, /swagger.json, /api-docs) served text/html SPA
    shells, not JSON, and were rejected. No openapi/ directory was created because
    fabricating or reconstructing a spec would be worse than an empty one.
