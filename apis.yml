apis:
- aid: uplight:uplight-developer-platform-api
  name: Uplight Developer Platform API
  description: >-
    Uplight markets a Developer Platform that exposes customer, program, eligibility,
    enrollment, device, and energy-flexibility data to utilities and ecosystem partners
    through APIs. The reference is published on a ReadMe portal at docs.uplight.com,
    but the /developer path 302-redirects to dash.readme.com login, so no operation,
    schema, scope, or rate limit is publicly readable. The production gateway at
    api.uplight.com is real and reachable (Kong Enterprise 3.10) but returns HTTP 401
    with an "Invalid or no token provided" error to every anonymous request, including
    /openapi.json, /swagger.json, /v1, and /.well-known/openid-configuration. Listed
    here as a real but fully gated surface; no endpoints are claimed because none are
    documented publicly.
  humanURL: https://docs.uplight.com/
  baseURL: https://api.uplight.com
