name: Uplight
kind: company
description: >-
  Uplight is a Boulder, Colorado energy technology company formed in 2019 from the
  merger of Tendril and Simple Energy and expanded through the acquisitions of
  EnergySavvy, FirstFuel, Ecotagious, EEme, and DERMS/VPP provider AutoGrid (closed
  February 2024). It sells software to electric and gas utilities and retailers in
  North America, Europe, and Asia rather than to consumers, covering energy efficiency
  and electrification marketplaces, home energy reports, rate engagement, demand
  response, distributed energy resource management (DERMS), virtual power plants, and
  a utility data lake with analytics. In the United States value chain Uplight sits on
  the utility side of the meter as a vendor and orchestration layer between the
  utility, its customers, and connected devices, and it publicly states support for
  OpenADR, IEEE 2030.5, Modbus, DNP3 and other SCADA protocols for DER control. Its
  API posture is honestly closed — a Developer Platform exists and is marketed to
  utilities and ecosystem partners, the documentation portal at docs.uplight.com
  serves a public landing shell but every Documentation and API Reference path
  redirects to a ReadMe login, and the production gateway at api.uplight.com answers
  anonymously only with HTTP 401 and a bearer-token error. No consumer usage-data API,
  no open market data, no downloadable OpenAPI, and no Green Button or ESPI reference
  could be found. Uplight is a software vendor, not a regulated data holder, so no
  consumer data mandate applies to it.
